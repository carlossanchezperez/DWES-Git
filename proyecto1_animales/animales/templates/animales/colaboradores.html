
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Colaboradores</title>
</head>
<body>
    <h1>Colaboradores de la protectora</h1>

    {% for colaborador in colaboradores %}
        <hr>
        <h2>{{ colaborador.nombre }}</h2>
        <p>Cargo: {{ colaborador.cargo }}</p>
        <p>Fecha de entrada:
            {{ colaborador.fecha_entrada_protectora|date:"d/m/Y H:i" }}
        </p>
    {% empty %}
        <p>No hay colaboradores registrados.</p>
    {% endfor %}

    <nav>
        <a href="{% url 'lista_animales' %}">Animales</a>
        <a href="{% url 'lista_protectoras' %}">Protectoras</a>
    </nav>
</body>
</html>
